services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://root:example@mongodb:27017/openstock?authSource=admin
      SCRAPLING_WORKER_URL: http://scrapling-worker:8091
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      scrapling-worker:
        condition: service_started

  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  scrapling-worker:
    build:
      context: ./services/scrapling-worker
      dockerfile: Dockerfile
    ports:
      - "8091:8091"
    environment:
      SCRAPLING_WORKER_TOKEN: ${SCRAPLING_WORKER_TOKEN:-}
      MONGODB_URI: mongodb://root:example@mongodb:27017/openstock?authSource=admin
      MONGODB_DB: openstock
      WEB_INGEST_URL: http://web:3000/api/media/ingest
      WEB_INSIDER_INGEST_URL: http://web:3000/api/insider/ingest
      SOURCES_CONFIG: /app/sources.yaml
      SCRAPE_RATE_LIMIT_SECONDS: "2"
      SCRAPLING_STEALTH: "false"
      OPENINSIDER_LIST_CACHE_SECONDS: "900"
    volumes:
      - ./services/scrapling-worker/sources.yaml:/app/sources.yaml:ro
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo-data:
